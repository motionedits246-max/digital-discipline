plugins {
    id 'com.android.application' version '8.9.3'
}

android {
    namespace 'com.digitaldiscipline.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.digitaldiscipline.android'
        minSdk 29
        targetSdk 35
        versionCode 7
        versionName '0.7.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
