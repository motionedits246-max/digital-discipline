name: Build Linux desktop package

on:
  push:
    branches: [feature/linux-desktop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digital-discipline-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-package:
    if: github.ref == 'refs/heads/feature/linux-desktop'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev libdbus-1-dev pkg-config file dbus-x11 x11-utils xvfb openbox xterm xprintidle xdotool
      - name: Build and verify the package
        run: bash scripts/build-linux.sh
      - name: Test installed desktop in X11
        run: |
          sudo apt-get install -y ./release-output/*.deb
          dbus-run-session -- xvfb-run -a bash scripts/smoke-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Digital-Discipline-Linux-amd64
          path: |
            release-output/*.deb
            release-output/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 30
