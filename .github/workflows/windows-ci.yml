name: Build Windows installer

on:
  push:
    branches: [main, feature/master-spec-complete-2026-11]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'GITHUB-BUILD-INSTRUCTIONS.md'
  workflow_dispatch:

concurrency:
  group: digital-discipline-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-2022
    timeout-minutes: 65
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Ensure application source was uploaded
        shell: pwsh
        run: |
          if (-not (Test-Path 'scripts/build-windows.ps1')) { throw 'Source missing: upload the DigitalDiscipline project before building.' }
          if (-not (Test-Path 'agent/Cargo.toml')) { throw 'Source missing: agent/Cargo.toml' }
      - name: Install Rust stable MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
      - name: Record build tool versions
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          node --version
          npm --version
          python --version
      - name: Create ephemeral development signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Digital Discipline Development (UNTRUSTED)' -CertStoreLocation 'Cert:\CurrentUser\My' -KeyAlgorithm RSA -KeyLength 3072 -HashAlgorithm SHA256 -NotAfter (Get-Date).AddDays(30)
          if (-not $cert.Thumbprint) { throw 'Could not create development certificate' }
          "DD_DEV_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $confPath = 'apps/desktop/src-tauri/tauri.conf.json'
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json -AsHashtable
          if (-not $conf['bundle'].ContainsKey('windows')) { $conf['bundle']['windows'] = @{} }
          $conf['bundle']['windows']['certificateThumbprint'] = $cert.Thumbprint
          $conf['bundle']['windows']['digestAlgorithm'] = 'sha256'
          $conf | ConvertTo-Json -Depth 60 | Set-Content $confPath -Encoding utf8
          New-Item -ItemType Directory -Force -Path release-output | Out-Null
          Export-Certificate -Cert $cert -FilePath release-output/dev-signing-public-cert.cer | Out-Null
          Write-Host 'Self-signed development certificate created. This does not establish public trust.'
      - name: Test and build Windows installer
        shell: pwsh
        run: |
          .\scripts\build-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed' }
      - name: Verify and hash installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release-output -Filter '*setup*.exe' -ErrorAction SilentlyContinue)
          if ($installers.Count -eq 0) { throw 'No NSIS installer produced' }
          $installers | ForEach-Object { Get-FileHash $_.FullName -Algorithm SHA256 }
          foreach ($exe in @(Get-ChildItem release-output -Filter '*.exe')) {
            $signature = Get-AuthenticodeSignature $exe.FullName
            if (-not $signature.SignerCertificate -or $signature.SignerCertificate.Thumbprint -ne $env:DD_DEV_CERT_THUMBPRINT) {
              throw "Development Authenticode signature missing on $($exe.Name)"
            }
            Write-Host "$($exe.Name): development-signed; status $($signature.Status) (self-signed, not publicly trusted)"
          }
          Get-ChildItem release-output -File | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)"
          } | Set-Content release-output/SHA256SUMS.txt -Encoding utf8
      - name: Upload Windows installer, agent, extension
        uses: actions/upload-artifact@v4
        with:
          name: DigitalDiscipline-MasterSpec-Branch-v0.3.9-DEV-SIGNED
          path: release-output/*
          if-no-files-found: error
          retention-days: 30
