name: Android prototype APK

on:
  push:
    branches: [feature/android-prototype]
    paths: ['apps/android/**', '.github/workflows/android-prototype.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: |
          sdk="$RUNNER_TEMP/digital-discipline-sdk"
          mkdir -p "$sdk"/{platforms,build-tools}
          cd "$RUNNER_TEMP"
          curl -fLsS --retry 3 https://dl.google.com/android/repository/platform-35_r02.zip -o android-platform.zip
          curl -fLsS --retry 3 https://dl.google.com/android/repository/build-tools_r35_linux.zip -o android-tools.zip
          sha256sum -c <<'CHECKSUMS'
          0988cacad01b38a18a47bac14a0695f246bc76c1b06c0eeb8eb0dc825ab0c8e0  android-platform.zip
          bd3a4966912eb8b30ed0d00b0cda6b6543b949d5ffe00bea54c04c81e1561d88  android-tools.zip
          CHECKSUMS
          unzip -q android-platform.zip -d "$sdk/platforms"
          unzip -q android-tools.zip -d "$sdk/build-tools"
          mv "$sdk/build-tools/android-15" "$sdk/build-tools/35.0.0"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >> "$GITHUB_ENV"
      - name: Build unsigned release
        run: gradle --no-daemon -p apps/android :app:lintRelease :app:assembleRelease
      - name: Verify alignment and prepare artifact
        run: |
          mkdir -p artifact
          apk=artifact/Digital-Discipline-Android-0.7.4-unsigned.apk
          cp apps/android/app/build/outputs/apk/release/app-release-unsigned.apk "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$apk"
          cd artifact
          sha256sum ./*.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Digital-Discipline-Android-0.7.4-unsigned
          path: artifact/
          if-no-files-found: error

  emulator-smoke:
    needs: unsigned-apk
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: Digital-Discipline-Android-0.7.4-unsigned
          path: artifact
      - name: Prepare test APK and Android emulator
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk/emulator" >> "$GITHUB_PATH"
          tools="$sdk/cmdline-tools/latest/bin"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/dd-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          image='system-images;android-35;default;x86_64'
          "$tools/sdkmanager" 'platform-tools' 'build-tools;35.0.0' 'emulator' "$image"
          printf 'no\n' | "$tools/avdmanager" create avd --force --name discipline-ci --package "$image" --device pixel_6
          "$sdk/emulator/emulator" -list-avds | grep -Fx discipline-ci
          keytool -genkeypair -keystore "$RUNNER_TEMP/dd-test.p12" -storepass android -keypass android -alias test -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=Digital Discipline emulator'
          "$sdk/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/dd-test.p12" --ks-pass pass:android --out "$RUNNER_TEMP/dd-test.apk" artifact/Digital-Discipline-Android-0.7.4-unsigned.apk
      - name: Check activity and focus on Android
        run: |
          acceleration=()
          if [[ -c /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm
          else
            acceleration=(-accel off)
          fi
          emulator -avd discipline-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect "${acceleration[@]}" > "$RUNNER_TEMP/dd-emulator.log" 2>&1 &
          pid=$!
          trap 'code=$?; if [[ $code != 0 ]]; then tail -60 "$RUNNER_TEMP/dd-emulator.log"; adb logcat -b crash -d -t 100 || true; fi; kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..100}; do
            kill -0 "$pid" || { echo "Emulator exited during boot"; exit 1; }
            boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [[ "$boot" == 1 ]]; then break; fi
            sleep 3
          done
          [[ "$boot" == 1 ]] || { echo "Android boot timed out"; exit 1; }
          adb install "$RUNNER_TEMP/dd-test.apk"
          python3 apps/android/tests/activity-smoke.py
