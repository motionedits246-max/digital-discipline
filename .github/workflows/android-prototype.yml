name: Android prototype APK

on:
  push:
    branches: [feature/android-prototype]
    paths: ['apps/android/**', '.github/workflows/android-prototype.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: |
          sdk="$RUNNER_TEMP/digital-discipline-sdk"
          mkdir -p "$sdk"/{platforms,build-tools}
          cd "$RUNNER_TEMP"
          curl -fLsS --retry 3 https://dl.google.com/android/repository/platform-35_r02.zip -o android-platform.zip
          curl -fLsS --retry 3 https://dl.google.com/android/repository/build-tools_r35_linux.zip -o android-tools.zip
          sha256sum -c <<'CHECKSUMS'
          0988cacad01b38a18a47bac14a0695f246bc76c1b06c0eeb8eb0dc825ab0c8e0  android-platform.zip
          bd3a4966912eb8b30ed0d00b0cda6b6543b949d5ffe00bea54c04c81e1561d88  android-tools.zip
          CHECKSUMS
          unzip -q android-platform.zip -d "$sdk/platforms"
          unzip -q android-tools.zip -d "$sdk/build-tools"
          mv "$sdk/build-tools/android-15" "$sdk/build-tools/35.0.0"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >> "$GITHUB_ENV"
      - name: Build unsigned release
        run: gradle --no-daemon -p apps/android :app:lintRelease :app:assembleRelease
      - name: Verify alignment and prepare artifact
        run: |
          mkdir -p artifact
          apk=artifact/Digital-Discipline-Android-0.1.0-unsigned.apk
          cp apps/android/app/build/outputs/apk/release/app-release-unsigned.apk "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$apk"
          cd artifact
          sha256sum ./*.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Digital-Discipline-Android-0.1.0-unsigned
          path: artifact/
          if-no-files-found: error
